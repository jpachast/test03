version: '3.8'

services:
  app:
    build: .
    container_name: openhands-chat
    ports:
      - "80:12000"
    volumes:
      # Datos persistentes
      - ./data:/app/data
      - ./projects:/app/projects
      
      # Código fuente como volúmenes (cambios se reflejan inmediatamente)
      - ./static:/app/static
      - ./ui:/app/ui
      - ./core:/app/core
      - ./config:/app/config
      - ./app.py:/app/app.py
      - ./requirements.txt:/app/requirements.txt
      
      # Repo test03 para el agente
      - ../../:/workspace/project/test03:rw
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
