version: '3.8'

services:
  app:
    build: .
    container_name: openhands-chat
    ports:
      - "80:12000"
    volumes:
      - ./data:/app/data
      - ./projects:/app/projects
      - ../../:/workspace/project/test03:ro  # Montar raíz del repo test03
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
